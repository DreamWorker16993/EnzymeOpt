[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enzymeopt"
version = "0.1.0"
description = "Reproducible experimental-design tools for Michaelis-Menten parameter estimation."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "DreamWorker16993", email = "jw2447@cam.ac.uk" },
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
enzymeopt = "enzymeopt.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
